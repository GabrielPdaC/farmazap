<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmaZap — Configurações</title>
  <style>
    :root { color-scheme: light; }
    body { font: 14px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0; background: #f1f5f9; color: #0f172a; }
    header { background: #075e54; color: #fff; padding: 14px 20px; font-size: 18px; font-weight: 600; }
    main { max-width: 760px; margin: 20px auto; padding: 0 16px; display: grid; gap: 16px; }
    section { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); display: grid; gap: 10px; }
    h2 { margin: 0; font-size: 15px; }
    label { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
    label.inline { display: flex; align-items: center; gap: 8px; font-weight: 400; }
    input[type=text], textarea { font: inherit; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    textarea { min-height: 190px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    small { color: #64748b; font-weight: 400; }
    pre { white-space: pre-wrap; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin: 0; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #1ebe5b; background: #25d366; color: #fff; font-weight: 600; cursor: pointer; justify-self: start; }
    .msg { font-size: 13px; }
    .ok { color: #15803d; } .erro { color: #b91c1c; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  </style>
</head>
<body>
  <header>FarmaZap — Configurações</header>
  <main>
    <section>
      <h2>Envio</h2>
      <label class="inline"><input type="checkbox" id="autoEnviar">
        Enviar automaticamente <small>(desmarcado: a extensão só deixa a mensagem pronta no WhatsApp e você clica em enviar)</small></label>
      <label>Nome da farmácia <input type="text" id="farmacia"></label>
    </section>

    <section>
      <h2>Mensagem</h2>
      <label>Modelo
        <small>Variáveis: {primeiro_nome}, {nome}, {farmacia}, {lista}. Use *negrito* e _itálico_ como no WhatsApp.</small>
        <textarea id="template"></textarea>
      </label>
      <label>Linha de cada medicamento em {lista}
        <small>Variáveis: {medicamento}, {termino}</small>
        <input type="text" id="linhaLista">
      </label>
      <div><strong>Prévia</strong> <small>(dados fictícios)</small></div>
      <pre id="previa"></pre>
      <div class="row">
        <button id="salvar">Salvar</button>
        <button id="restaurar" style="background:#fff;color:#0f172a;border-color:#cbd5e1">Restaurar padrão</button>
        <span id="msgSalvar" class="msg"></span>
      </div>
    </section>

    <section>
      <h2>Teste de envio</h2>
      <small>Envia a prévia acima para um número seu. O WhatsApp Web precisa estar aberto e logado em outra aba.</small>
      <div class="row">
        <label>WhatsApp <input type="text" id="telTeste" placeholder="(51) 99999-9999"></label>
        <button id="testar">Enviar teste</button>
      </div>
      <span id="msgTeste" class="msg"></span>
    </section>
  </main>
  <script src="../shared/util.js"></script>
  <script src="options.js"></script>
</body>
</html>
