<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>FarmaZap</title>
  <style>
    body { font: 13px/1.4 system-ui, "Segoe UI", sans-serif; width: 340px; margin: 0; color: #0f172a; }
    header { background: #075e54; color: #fff; padding: 10px 14px; font-weight: 600; font-size: 15px; }
    main { padding: 12px 14px; display: grid; gap: 10px; }
    .st { display: flex; justify-content: space-between; padding: 6px 8px; border-radius: 6px; background: #f1f5f9; }
    .on { color: #15803d; font-weight: 600; }
    .off { color: #b91c1c; font-weight: 600; }
    h3 { margin: 4px 0 0; font-size: 12px; color: #475569; text-transform: uppercase; letter-spacing: .03em; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 4px 2px; border-bottom: 1px solid #e2e8f0; }
    .vazio { color: #64748b; font-style: italic; }
    a { color: #075e54; }
  </style>
</head>
<body>
  <header>FarmaZap</header>
  <main>
    <div class="st"><span>G-MUS aberto</span><span id="gmus">…</span></div>
    <div class="st"><span>WhatsApp Web aberto</span><span id="wa">…</span></div>
    <div class="st"><span>Saídas aguardando aviso</span><span id="pend">…</span></div>
    <h3>Últimos avisos</h3>
    <div id="hist" class="vazio">Carregando…</div>
    <a href="#" id="opcoes">Configurações e teste de envio</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
